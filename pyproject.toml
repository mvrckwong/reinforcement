[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["configs", "src"]

[project]
name = "reinforcement-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.34.0",
    "gputil>=1.4.0",
    "gymnasium>=0.28.1",
    "ipykernel>=7.0.1",
    "ipywidgets>=8.1.7",
    "loguru>=0.7.3",
    "pendulum>=3.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.1.1",
    "ray[rllib]>=2.7.2",
    "setuptools>=65,<70",
    "torch>=2.0.0,<2.5.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pandas>=2.3.3",
]
notebook = [
    "python-dotenv>=1.2.1",
]
notebooks = [
    "fredapi>=0.5.2",
    "matplotlib>=3.10.8",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
]
ref = [
    "ccxt>=4.5.29",
    "schedule>=1.2.2",
    "termcolor>=3.2.0",
    "websockets>=15.0.1",
]
